<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account · Split Slip</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef4ed;color:#233f33;font:16px/1.5 system-ui;min-height:100svh;display:grid;place-items:center;padding:18px}main{background:white;border-radius:22px;padding:30px;width:min(100%,420px)}h1{font:36px Georgia;margin-bottom:0}a{color:#27583f}nav{display:flex;gap:20px;margin:20px 0}label{display:grid;gap:5px;margin:12px 0}input,button{font:inherit;border:1px solid #bdcfc1;border-radius:9px;padding:10px;width:100%}button{background:#285d46;color:white;cursor:pointer}#refresh{width:auto;background:white;color:#285d46;padding:2px 8px}[hidden]{display:none}#message{color:#94462d}</style>
<main><a href="index.html">Split Slip.</a><h1 id="heading">Welcome back</h1><p>Split expenses, not friendships.</p><nav><a href="#login">Log in</a><a href="#signup">Sign up</a></nav>
<form id="account"><label id="nameRow">Full name<input id="fullName" maxlength="80" autocomplete="name"></label><label>Phone number<input id="phone" type="tel" pattern="[6-9][0-9]{9}" maxlength="10" placeholder="10-digit Indian mobile number" required></label><label id="upiRow">UPI-linked phone (optional)<input id="upi" type="tel" pattern="[6-9][0-9]{9}" maxlength="10"></label><label>Password<input id="password" type="password" maxlength="256" required></label><label>Human check <strong id="question"></strong><input id="answer" inputmode="numeric" required></label><button type="button" id="refresh">New question</button><p id="message" role="status"></p><button id="submit">Log in</button></form></main>
<script src="/account.js"></script></html>
